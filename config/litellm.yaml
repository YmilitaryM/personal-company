# LiteLLM Proxy Config — Multi-Provider Model Gateway
# Claude Code 连接: ANTHROPIC_BASE_URL=http://localhost:4000
# Web 管理: http://localhost:4000/ui

general_settings:
  master_key: ${LITELLM_MASTER_KEY}
  database_url: ${LITELLM_DB_URL:-sqlite:///./.litellm.db}

model_list:
  # ── Anthropic (Claude) ──
  - model_name: claude-opus-4-7
    litellm_params:
      model: claude-opus-4-7
      api_key: ${ANTHROPIC_API_KEY}
      rpm: 50
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: claude-sonnet-4-6
      api_key: ${ANTHROPIC_API_KEY}
      rpm: 100
  - model_name: claude-haiku-4-5
    litellm_params:
      model: claude-haiku-4-5
      api_key: ${ANTHROPIC_API_KEY}
      rpm: 200

  # ── DeepSeek ──
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: ${DEEPSEEK_API_KEY}
      rpm: 100
  - model_name: deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: ${DEEPSEEK_API_KEY}
      rpm: 50

  # ── OpenAI ──
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: ${OPENAI_API_KEY}
      rpm: 50
  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: ${OPENAI_API_KEY}
      rpm: 100

  # ── Qwen (通义千问) ──
  - model_name: qwen3-coder
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: ${DASHSCOPE_API_KEY}
      rpm: 100

litellm_settings:
  set_verbose: false
  drop_params: true
  request_timeout: 120

router_settings:
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 30
