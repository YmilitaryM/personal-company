# Standard CI/CD Pipeline Template
# Generated by DevOps — customize per project

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Stage 1: Lint ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: echo "Add lint command here"
        # Example: npm run lint

  # ── Stage 2: Test ──
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit Tests
        run: echo "Add test command here"
        # Example: npm test -- --coverage
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # ── Stage 3: Build ──
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "Add build command here"
        # Example: npm run build
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  # ── Stage 4: Security Scan ──
  security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Scan
        run: echo "Add dependency scan command here"
        # Example: npm audit --audit-level=high
      - name: SAST Scan
        run: echo "Add SAST scan command here"
        # Example: semgrep ci

  # ── Stage 5: Deploy Staging ──
  deploy-staging:
    needs: security
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
      - name: Deploy to Staging
        run: echo "Add staging deploy command here"

  # ── Stage 6: E2E Tests ──
  e2e:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: E2E Tests
        run: echo "Add E2E test command here"
        # Example: npm run test:e2e

  # ── Stage 7: Deploy Production ──
  deploy-production:
    needs: e2e
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
      - name: Deploy to Production
        run: echo "Add production deploy command here"
